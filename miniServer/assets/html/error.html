<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{errorCode}} - {{errorMassage}}</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #0b0e14;
      color: #e2e8f0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .container {
      max-width: 540px;
      width: 100%;
      text-align: center;
      background-color: #151a24;
      border: 2px solid #2d3748;
      padding: 48px 32px;
      border-radius: 0px;
      box-shadow: 8px 8px 0px #000000;
    }

    .error-code {
      font-size: 112px;
      font-weight: 800;
      line-height: 1;
      color: #3b82f6;
      letter-spacing: -2px;
      margin-bottom: 12px;
    }

    .error-title {
      font-size: 24px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .error-desc {
      font-size: 15px;
      color: #94a3b8;
      line-height: 1.6;
      margin-bottom: 32px;
    }

    .btn-home {
      display: inline-block;
      background-color: #3b82f6;
      color: #ffffff;
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
      padding: 14px 28px;
      border: 2px solid #3b82f6;
      border-radius: 0px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      transition: background-color 0.2s, color 0.2s;
    }

    .btn-home:hover {
      background-color: transparent;
      color: #3b82f6;
    }

    /* Ilustrasi SVG bergaya geometris / kotak */
    .illustration {
      margin: 36px auto 24px;
      max-width: 260px;
    }

    .credits {
      font-size: 12px;
      color: #64748b;
      border-top: 1px solid #2d3748;
      padding-top: 20px;
      margin-top: 12px;
    }

    .credits a {
      color: #94a3b8;
      text-decoration: none;
      border-bottom: 1px solid #64748b;
    }

    .credits a:hover {
      color: #ffffff;
    }
  </style>
</head>
<body>

  <main class="container">
    <div class="error-code">{{errorCode}}</div>
    <h1 class="error-title">{{errorMessage}}</h1>
    <p class="error-desc">
      {{errorExplain}}
    </p>
    
    <!-- Ilustrasi SVG bawaan (tanpa gambar eksternal) -->
    <div class="illustration">
      <svg viewBox="0 0 300 160" width="100%" height="auto" xmlns="http://www.w3.org/2000/svg">
        <!-- Grid background kotak -->
        <rect x="10" y="10" width="280" height="140" fill="#0b0e14" stroke="#2d3748" stroke-width="2"/>
        <line x1="10" y1="45" x2="290" y2="45" stroke="#2d3748" stroke-width="2"/>
        
        <!-- Tombol window kotak -->
        <rect x="22" y="22" width="10" height="10" fill="#ef4444"/>
        <rect x="38" y="22" width="10" height="10" fill="#eab308"/>
        <rect x="54" y="22" width="10" height="10" fill="#22c55e"/>
        
        <!-- Elemen blok rusak/terpisah -->
        <rect x="45" y="70" width="60" height="55" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
        <line x1="60" y1="88" x2="90" y2="108" stroke="#ef4444" stroke-width="3"/>
        <line x1="90" y1="88" x2="60" y2="108" stroke="#ef4444" stroke-width="3"/>

        <!-- Garis putus-putus koneksi terputus -->
        <line x1="115" y1="97" x2="175" y2="97" stroke="#64748b" stroke-width="2" stroke-dasharray="6,6"/>

        <!-- Blok tujuan kosong -->
        <rect x="185" y="70" width="70" height="55" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="5,5"/>
        <rect x="205" y="88" width="30" height="6" fill="#334155"/>
        <rect x="205" y="100" width="20" height="6" fill="#334155"/>
      </svg>
    </div>

    <div class="credits">
      By @Herlambang YP<br>
    </div>
  </main>

</body>
</html>
