<!DOCTYPE html>
<html lang="{{lang}}">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Server - Explorer</title>
    <link rel="icon" type="image/png" href="/miniServer/icon/favicon.png?v={{dateNowPy}}">
    <style>
        .en, .ind {
            display: none;
        }

        html[lang="en"] .en {
            display: inherit;
        }

        html[lang="id"] .ind {
            display: inherit;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0b0e14;
            color: #e2e8f0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            padding: 40px 20px;
        }

        a {
            color: #94a3b8;
            text-decoration: none;
            border-bottom: 1px solid #64748b;
        }

        a:hover {
            color: #ffffff;
        }

        .container {
            max-width: 820px;
            margin: 0 auto;
            background-color: #151a24;
            border: 2px solid #2d3748;
            border-radius: 0px;
            box-shadow: 8px 8px 0px #000000;
        }

        .header {
            padding: 24px 28px;
            border-bottom: 2px solid #2d3748;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .header h1 {
            font-size: 20px;
            font-weight: 800;
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .badge {
            background-color: #3b82f6;
            color: #ffffff;
            font-size: 10px;
            font-weight: 700;
            padding: 2px 3px;
            border-radius: 3px;
        }

        .path-bar {
            background-color: #0b0e14;
            padding: 12px 28px;
            border-bottom: 2px solid #2d3748;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 14px;
            color: #94a3b8;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .path-bar span {
            color: #3b82f6;
            font-weight: 700;
        }

        .list-header {
            display: flex;
            padding: 12px 28px;
            background-color: #1e2533;
            border-bottom: 2px solid #2d3748;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #94a3b8;
            justify-content: space-between;
        }

        .list-header div:last-child {
            text-align: right;
        }

        .file-list {
            list-style: none;
        }

        .file-list li {
            border-bottom: 1px solid #2d3748;
        }

        .file-list li:last-child {
            border-bottom: none;
        }

        .file-item {
            display: flex;
            align-items: center;
            padding: 14px 28px;
            text-decoration: none;
            color: #e2e8f0;
            transition: background-color 0.15s, padding-left 0.15s;
            justify-content: space-between;
        }

        .file-item:hover {
            background-color: #1e293b;
            padding-left: 34px;
        }

        .item-name {
            display: flex;
            align-items: center;
            gap: 14px;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 15px;
        }

        .is-folder .item-name {
            color: #ffffff;
            font-weight: 700;
        }

        .file-item:hover .item-name {
            color: #3b82f6;
        }

        .item-type {
            text-align: right;
            font-size: 12px;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            color: #64748b;
            text-transform: uppercase;
        }

        .icon {
            width: 20px;
            height: 20px;
            flex-shrink: 0;
        }

        .footer {
            padding: 16px 28px;
            border-top: 2px solid #2d3748;
            background-color: #0b0e14;
            font-size: 12px;
            color: #64748b;
            display: flex;
            justify-content: space-between;
        }
    </style>
</head>

    <main class="container">
        <!-- Header -->
        <header class="header">
            <div style="display: flex; align-items: center; gap: 10px;">
                <img src="/miniServer/icon/favicon.png" style="max-height: 50px; width: auto;">
                <div>
                    <span class="badge">HYP MINI SERVER</span>
                    <h1>
                        DIRECTORY LISTING
                    </h1>
                </div>
            </div>
        </header>
        <div class="path-bar">
            <span>PATH:</span> {{directoryPath}}
        </div>

        <div class="list-header">
            <div>File Name</div>
            <div>Type</div>
        </div>

        <ul class="file-list">
            {{directoryContent}}
        </ul>

        <footer class="footer">
            <span>{{itemCount}} items</span>
            <span style="display: flex; align-items: center;">By&nbsp;<a
                    href="https://herlambangyp.github.io/">@Herlambang YP</a></span>

        </footer>
    </main>

</html>
