<fieldset class="fieldset bg-base-200 border-base-300 rounded-box w-xs border p-4">
  <legend class="fieldset-legend">HYP Python Converter</legend>

  <div id="pythonStatus"></div>
  <div id="faq" class="w-full -mb-3 relative -top-1.5"></div>

  <label class="label">Tipe File Input:</label>
  <select class="select">
    <option disabled selected>Pilih Tipe File</option>
    <option>PDF</option>
    <option>JPG</option>
    <option>PNG</option>
    <option>WEBP</option>
  </select>

  <label class="label">Input File: </label>
  <div class="min-h-14 border-dashed border rounded-md opacity-55 flex flex-col justify-center items-center"><input type="file" class="file-input file-input-ghost" /></div>

  <label class="label">Slug</label>
  <input type="text" class="input" placeholder="my-awesome-page" />

  <label class="label">Author</label>
  <input type="text" class="input" placeholder="Name" />

</fieldset>
