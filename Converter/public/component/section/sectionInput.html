<div class="card border border-base-300 bg-base-100 shadow-sm">
  <div class="card-body gap-4 p-5">
    <div class="flex items-center justify-between text-sm">
      <div>
        <h2 class="font-semibold">Format File Input</h2>
        <span class="text-xs opacity-60">Format file yang diupload</span>
      </div>
      <span class="badge badge-primary">PDF</span>
      <!-- <select id="formatInput" value="pdf" class="select select-primary w-max" selectFileUmum>
      </select> -->

    </div>
    <label id="dropzone" for="pdfInput"
      class="group flex min-h-52 cursor-pointer flex-col py-2 px-5 items-center justify-between rounded-2xl border-2 border-dashed border-base-content/50 bg-base-200/50 text-center transition hover:border-primary/60 hover:bg-primary/5">
      <div class="flex flex-col items-center mt-5">
        <div class="mb-4 grid size-14 place-items-center rounded-2xl bg-base-100 text-primary shadow-sm text-2xl">
          ↑
        </div>
        <span class="font-semibold">Drag & Drop kesini <br>atau klik untuk memilih file</span>
      </div>
      <span class="mt-4 text-[9px] md:text-[11px] text-base-content/40">Bukan upload ke internet!<br>File diupload ke
        sistem Python lokal tanpa internet</span>
      <input id="pdfInput" class="hidden" type="file" accept="application/pdf,.pdf" multiple>
    </label>
    <div class="flex items-center justify-between gap-3">
      <h3 class="text-sm font-semibold">Daftar file</h3><button id="clearFiles" class="btn btn-ghost btn-xs"
        type="button" disabled>Hapus semua</button>
    </div>
    <div id="fileList" class="space-y-2">
      <div id="emptyFiles"
        class="rounded-xl border border-base-300 border-dashed px-4 py-6 text-center text-sm text-base-content/45">
        Belum ada dokumen yang dipilih.</div>
    </div>
  </div>
</div>
